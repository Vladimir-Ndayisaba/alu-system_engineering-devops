<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #312e81, #581c87);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            width: 100%;
        }

        .planet {
            font-size: 90px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(100px, 22vw, 180px);
            line-height: 1;
            font-weight: 900;
            background: linear-gradient(90deg, #a78bfa, #38bdf8);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        h2 {
            font-size: 30px;
            margin: 20px 0;
        }

        p {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .french {
            color: #a78bfa;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 15px 30px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .home-button:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-4px);
        }

        .footer {
            margin-top: 50px;
            font-size: 13px;
            color: #94a3b8;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 23px;
            }

            p {
                font-size: 15px;
            }

            .planet {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="planet" aria-hidden="true">🪐</div>

        <h1>404</h1>

        <h2>Oops! You've Lost Your Way.</h2>

        <p>
            Looks like you've travelled beyond our digital universe.
            The page you're searching for doesn't exist or has moved
            to another galaxy.
        </p>

        <p class="french">
            Ceci n'est pas une page
        </p>

        <a href="/" class="home-button">Back to Homepage →</a>

        <div class="footer">
            © 2026 Vladimir's Digital Space. All rights reserved.
        </div>
    </main>
</body>
</html>
